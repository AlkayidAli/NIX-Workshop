<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Flex:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>

  <body class="app-container">
    <div id="header"></div>
    <main class="main-container">
      <div class="weather-header">
        <p class="weather-title">Weather</p>
        <div class="search-bar">
          <img
            src="../images/icons/search.png"
            alt="search icon"
            class="search-icon"
          />
          <input
            type="text"
            name="city-search"
            id="city-search"
            class="city-search"
            placeholder="Search city"
            data-testid="search"
          />
        </div>
      </div>
      <div class="weather-container">
        <div class="location-date">
          <div class="location" id="location">
            <img src="../images/icons/location.png" alt="location icon" />
            <p class="city-name" id="city-name">Budapest, Hungary</p>
          </div>
          <div class="date" id="weekday">
            <p class="date-text" id="date-text">Tuesday, 15 Nov, 2023</p>
          </div>
        </div>

        <div class="weather-details" id="weatherDetails">
          <div class="main-details">
            <img alt="weather-status-icon" class="weather-status-icon" />
            <p class="temp" id="temp" data-testid="details-list">+17c</p>
          </div>
          <div class="additional-details" data-testid="details-list">
            <p>Humidity:<span id="humidity">30 %</span></p>
            <p>Pressure:<span id="pressure">450 dp</span></p>
            <p>Wind:<span id="wind">10 km/h</span></p>
            <p>Precipitation:<span id="precipitation">5.1 ml</span></p>
          </div>
        </div>

        <div class="filters">
          <div class="day-filter" id="daysSwitch">
            <a href="#" class="menu-item" id="sevenDays">7 days</a>
            <a href="#" class="menu-item" id="tenDays">10 days</a>
          </div>
          <div class="unit-filter">
            <div class="temp-unit toggle-container">
              <label class="toggle-switch">
                <input type="checkbox" id="tempUnitToggle" />
                <span
                  class="toggle-slider"
                  data-left="°C"
                  data-right="°F"
                ></span>
              </label>
            </div>
            <div class="speed-unit toggle-container">
              <label class="toggle-switch">
                <input type="checkbox" id="speedUnitToggle" />
                <span
                  class="toggle-slider"
                  data-left="km/h"
                  data-right="m/h"
                ></span>
              </label>
            </div>
          </div>
        </div>
        <div class="weather-forcast" id="weatherForecast">
          <!-- forcast days will be added here dynmaiclly  -->
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
