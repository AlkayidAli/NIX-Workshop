<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Flex:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Pad</title>
  </head>

  <body class="app-container">
    <div id="header"></div>
    <main class="main-container">
      <div class="header-controls">
        <div class="title-container">
          <p>THINGS TO DO</p>

          <button class="btn-primary" id="addNoteBtn">
            <img src="../images/icons/plus-symbol.png" alt="plus-symbol" />
            <span>ADD NOTE</span>
          </button>
        </div>
        <div class="filters">
          <button
            class="btn-secondary"
            id="allFilterBtn"
            data-testid="allFilterBtn"
          >
            All notes <span></span>
          </button>
          <button
            class="btn-secondary"
            id="activeFilterBtn"
            data-testid="activeFilterBtn"
          >
            Active <span></span>
          </button>
          <button
            class="btn-secondary"
            id="completedFilterBtn"
            data-testid="completedFilterBtn"
          >
            Complited <span></span>
          </button>
        </div>
      </div>
      <div class="note-list-container" id="noteList">
        <!-- note items will be added here -->
      </div>
    </main>

    <div class="modal" id="modal">
      <div class="modal-content">
        <form id="noteForm">
          <div class="form-group">
            <label for="form-title">Title</label>
            <input type="tel" name="form-title" id="form-title" />
          </div>

          <div class="form-group">
            <label for="form-description">Description</label>
            <textarea
              name="form-description"
              id="form-description"
              rows="10"
            ></textarea>
          </div>

          <div class="form-buttons">
            <button class="btn-primary" id="form-cancel-btn">Cancel</button>
            <button class="btn-primary" id="form-save-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
    <div id="footer"></div>
  </body>
</html>
