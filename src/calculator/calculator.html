<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Flex:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Calculator</title>
  </head>

  <body>
    <div id="header"></div>
    <main class="main-container" data-testid="main">
      <p id="title-text">Calculator</p>
      <div class="calculator-history-container">
        <div class="calculator-container" id="calculator">
          <input type="text" id="calculationInput" readonly />
          <div class="buttons-container">
            <button class="number-button operator">AC</button>
            <button class="number-button operator">+/-</button>
            <button class="number-button operator">%</button>
            <button class="number-button operator">÷</button>
            <button class="number-button">7</button>
            <button class="number-button">8</button>
            <button class="number-button">9</button>
            <button class="number-button operator">×</button>
            <button class="number-button">4</button>
            <button class="number-button">5</button>
            <button class="number-button">6</button>
            <button class="number-button operator">-</button>
            <button class="number-button">1</button>
            <button class="number-button">2</button>
            <button class="number-button">3</button>
            <button class="number-button operator">+</button>
            <button class="number-button zero">0</button>
            <button class="number-button">,</button>
            <button class="number-button operator">=</button>
          </div>
        </div>

        <div class="history-container">
          <a class="menu-item" id="history-toggle"
            >HISTORY<img
              src="../images/icons/d-arrow.png"
              alt="arrow"
              class="toggle-arrow"
          /></a>
          <ul id="history-list">
            <!-- history items will added here -->
          </ul>
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </body>
</html>
